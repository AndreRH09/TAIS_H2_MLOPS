[project]
name = "msft-mlops"
version = "0.1.0"
description = "Experimento: modelo estático vs. modelo operado con MLOps sobre MSFT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.2,<3",
    "numpy>=2.0",
    "scipy>=1.13",
    "evidently>=0.7,<0.8",
    "mlflow>=3.0",
    "matplotlib>=3.9",
    "skops>=0.10",
]

[project.scripts]
msft-mlops = "msft_mlops.cli:main"

[dependency-groups]
app = [
    "streamlit>=1.40",
]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = [
    "ipykernel>=7.4.0",
]
validation = ["yfinance>=0.2.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msft_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: ejecuta el experimento completo sobre datos reales"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Cuadernos de clase: estilo libre. .specify/: scripts de Spec Kit de terceros (no se reformatean
# para no divergir de upstream). El lint y el formato cubren el paquete y los tests.
extend-exclude = ["*.ipynb", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # cadenas largas en español (informes); el formateador cubre el código
